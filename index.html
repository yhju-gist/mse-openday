/* GIST 신소재 연구 취향 테스트 · GIST red 스킨 (ChatGPT v3.4 app.mjs 마크업용)
   app.mjs / journey.mjs / faculty.mjs / curriculum.mjs 는 그대로 두고 이 파일로 style.css 만 교체한다.
   체계: 사전 오픈데이·개강파티 리플렛. GIST red #d1231b 전면 띠 + 점 격자, 흰 바탕, 검정 본문, 회색 헤어라인,
   번호 레이블(IBM Plex Mono), 네모 불릿, 체크박스형 선택지. 2026-10-23. */
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap");
:root{
 --red:#d1231b;--red2:#b81d16;--ink:#1c1f1f;--ink2:#464a4a;--gray:#7d8281;--line:#cfd1d0;--line2:#e4e6e5;--panel:#f4f5f4;--bg:#fff;
 --paper:#fff;--white:#fff;--muted:#464a4a;--accent:#d1231b;--blue:#d1231b;--blue-wash:#f4f5f4;--green:#d1231b;
 --sans:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --gutter:max(20px,env(safe-area-inset-left,0px));
 font-family:var(--sans);color:var(--ink);background:var(--bg);font-synthesis:none;color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column;overflow-x:clip}
button,a,input{font:inherit}
button{cursor:pointer;color:inherit;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
button:disabled{cursor:not-allowed;opacity:.35}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
main:focus,h1:focus,[tabindex="-1"]:focus{outline:none}
h1,h2,h3,h4,p,ul,ol{margin:0}
h1,h2{font-weight:900;letter-spacing:-.035em;line-height:1.2;text-wrap:balance}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
svg{display:block}
small{font-size:13px}
::selection{background:#fbe2d5;color:var(--ink)}
.wrap,.result-wrap,.quiz-wrap,.site-header,.site-footer{max-width:1120px;margin-left:auto;margin-right:auto;padding-left:var(--gutter);padding-right:max(20px,env(safe-area-inset-right,0px))}
main{flex:1;min-height:60svh;outline:none}
/* 전면 띠: wrap 안에서 화면 끝까지 */
.band-full{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:max(var(--gutter),calc(50vw - 560px));padding-right:max(20px,calc(50vw - 560px))}
.hero,.event-section,.result-hero{background:var(--red);color:#fff;position:relative;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:max(var(--gutter),calc(50vw - 560px));padding-right:max(20px,calc(50vw - 560px))}
.hero::before,.event-section::before,.result-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.2px);background-size:22px 22px;pointer-events:none}
.hero>*,.event-section>*,.result-hero>*{position:relative}

/* 공통 레이블·버튼·링크 */
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;color:var(--ink2)}
.eyebrow .dot{width:9px;height:9px;background:var(--red);flex:none}
.section-number{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;font-weight:600;color:var(--red);margin:0 0 16px}
.section-number::after{content:"";flex:1;height:1px;background:var(--line)}
.section-sub{font-size:13.5px;color:var(--ink2);margin:6px 0 20px;max-width:52em}
.primary{display:inline-flex;align-items:center;gap:14px;padding:14px 22px;min-height:50px;background:var(--red);color:#fff;border:1px solid var(--red);font-weight:700;font-size:15px;letter-spacing:-.01em;border-radius:0;transition:background .15s,color .15s,border-color .15s}
.primary:hover:not(:disabled){background:var(--red2);border-color:var(--red2)}
.primary .arrow{font-family:var(--mono);font-weight:400;font-size:17px}
.secondary{display:inline-flex;align-items:center;gap:12px;padding:12px 18px;min-height:46px;background:transparent;color:var(--ink);border:1px solid var(--ink);font-weight:700;font-size:14px;border-radius:0;transition:background .15s}
.secondary:hover:not(:disabled){background:var(--panel)}
.text-button,.back-btn,.ask-copy,.event-actions button,.event-actions a,.faculty-links a,.curriculum-source a,.faculty-source a,.result-details a{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;color:var(--ink);font-size:14px}
.text-button:hover,.back-btn:hover,.ask-copy:hover,.faculty-links a:hover,.curriculum-source a:hover{color:var(--red)}
.mono{font-family:var(--mono)}

/* 헤더·푸터 */
.site-header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:16px;padding-bottom:16px;font-size:13px;font-weight:500;color:var(--ink2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}

.brand-dot{display:none}
.brand-name{font-size:14px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.01em;border:0;padding:0}
.brand-name small{display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.06em;color:var(--gray);margin-top:2px}
.header-event{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px;font-weight:500}
.header-event span{font-size:13px;color:var(--red)}
.site-footer{width:100%;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:20px;padding-bottom:36px;margin-top:56px;border-top:1px solid var(--line);font-size:12px;color:var(--gray)}
.site-footer .text-button{font-size:12px;color:var(--gray)}

/* 첫 화면 */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end;padding-top:60px;padding-bottom:56px}
.hero .eyebrow{color:rgba(255,255,255,.9);margin-bottom:22px}
.hero .eyebrow .dot{background:#fff}
.hero h1{font-size:clamp(42px,6vw,76px);color:#fff;margin:0 0 22px}
.hero h1 em{font-style:normal;background:#fff;color:var(--red);padding:0 .14em;margin:0 .02em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero-question{color:#fff}
.hero .lead{font-size:16px;line-height:1.8;max-width:32em;color:rgba(255,255,255,.95)}
.hero-audience{font-size:13px;font-weight:500;margin-top:14px;color:rgba(255,255,255,.9)}
.cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:30px}
.hero .primary{background:#fff;color:var(--red);border-color:#fff}
.hero .primary:hover:not(:disabled){background:var(--ink);color:#fff;border-color:var(--ink)}
.subtle{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:rgba(255,255,255,.85)}
.subtle b{font-weight:600;color:#fff}
.subtle>span{margin-left:6px}
.hero-note{font-size:12.5px;margin-top:14px;color:rgba(255,255,255,.75)}
.hero>.artboard{min-width:0;border:1px solid rgba(255,255,255,.45);padding:18px 20px 16px;color:#fff;background:rgba(255,255,255,.04)}
.art-meta{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:12px}
.art-meta span:first-child::before{content:"";display:inline-block;width:7px;height:7px;background:#fff;margin-right:9px;vertical-align:middle}
.science-figure{width:100%;height:auto;margin:10px 0 2px;overflow:visible}
#science-grid path{stroke:#fff;stroke-opacity:.22}
.science-corners{stroke:rgba(255,255,255,.7)}
.lattice-bonds{stroke:rgba(255,255,255,.6);stroke-width:1}
.lattice-atoms{fill:#fff;stroke:var(--red);stroke-width:1.2}
.lattice-atoms .atom-active{fill:var(--ink);stroke:#fff}
.science-leader{stroke:rgba(255,255,255,.8);stroke-width:1}
.science-labels{font:500 14px var(--sans);fill:#fff}
.science-wave{stroke:#fff;stroke-width:1.4}
.science-wave .wave-axis{stroke:rgba(255,255,255,.4);stroke-width:.6}
.science-response{fill:rgba(255,255,255,.8);font:9px var(--mono);letter-spacing:.1em}
.art-bottom{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:rgba(255,255,255,.9);border-top:1px solid rgba(255,255,255,.35);padding-top:12px;line-height:1.6}
.rule-row{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);padding:0}
.rule-item{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:28px 24px 26px 0}
.rule-item+.rule-item{padding-left:24px;border-left:1px solid var(--line)}
.rule-item .num{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--red);font-weight:600;padding-top:5px}
.rule-item b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.rule-item p{font-size:13px;line-height:1.65;color:var(--ink2);margin-top:4px}

/* 오픈데이 띠 (첫 화면·결과·다이얼로그) */
.event-section{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding-top:44px;padding-bottom:48px;margin-top:56px}
.event-section .eyebrow{color:rgba(255,255,255,.85)}
.event-section .eyebrow .dot{background:#fff}
.event-section h2{font-size:clamp(26px,3vw,36px);color:#fff;margin:14px 0 10px}
.event-section>div>.event-note{font-size:15px;color:rgba(255,255,255,.9);line-height:1.7;margin-top:6px}
.event-info{display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap}
.event-info strong{display:block;font-size:clamp(30px,4vw,48px);font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.event-info p{font-size:15px;font-weight:500;margin-top:10px}
.event-info .secondary{color:#fff;border-color:rgba(255,255,255,.8);font-size:13px;min-height:42px;padding:9px 14px}
.event-info .secondary:hover:not(:disabled){background:#fff;color:var(--red)}
.programs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.programs span{font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.6);padding:4px 10px}
.programs span+span::before{content:none}
.event-section .event-note{font-size:13px;line-height:1.7;margin-top:12px;color:rgba(255,255,255,.85)}
.event-actions{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:20px}
.event-section .event-actions button,.event-section .event-actions a{color:#fff;font-size:14px;min-height:30px;display:inline-flex;align-items:center}
.event-section .event-actions .primary{text-decoration:none;background:#fff;color:var(--red);border-color:#fff;padding:12px 18px;min-height:46px;font-size:14px}

/* 질문 */
.quiz-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:64px;padding-top:36px;padding-bottom:64px}
.quiz-aside{position:sticky;top:32px;align-self:start;padding-top:6px;border-top:1px solid var(--ink)}
.quiz-aside .eyebrow{font-size:11px;color:var(--red);margin-top:14px}
.question-index{font-family:var(--sans);font-size:76px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:22px 0 22px;color:var(--ink);font-variant-numeric:tabular-nums}
.question-index span{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--gray);margin-left:8px}
.quiz-aside h2{font-size:24px;line-height:1.3;font-weight:900}
.quiz-aside>p{font-size:12.5px;color:var(--gray);line-height:1.8;margin-top:26px}
.quiz-stages{list-style:none;padding:0;margin:26px 0 0;font-size:13px;color:var(--gray);display:grid;gap:10px}
.quiz-stages li{display:flex;align-items:center;gap:12px}
.quiz-stages li::before{content:"";display:block;width:18px;height:2px;background:var(--line)}
.quiz-stages .active{color:var(--ink);font-weight:700}
.quiz-stages .active::before{background:var(--red)}
.quiz-card{min-width:0;padding:0;background:none;border:0;border-radius:0}
.progress-info{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;color:var(--ink2)}
.progress-count{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink2)}
.progress-track{height:4px;background:var(--line2);margin:10px 0 40px}
.progress-fill{height:100%;background:var(--red);transition:width .25s}
.question-context{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2);background:var(--panel);border:0;padding:8px 12px;margin:0 0 18px;line-height:1.6}
.question-context span{display:inline;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--red);font-weight:600;margin:0}
.quiz-card>.eyebrow{font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink2)}
.quiz-card>.eyebrow::before{content:"";width:9px;height:9px;background:var(--red);flex:none}
.quiz-card>.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.question-heading{font-size:clamp(30px,4vw,44px);font-weight:900;line-height:1.2;letter-spacing:-.035em;white-space:pre-line;margin:12px 0 12px}
.question-hint{font-size:14px;line-height:1.7;color:var(--ink2);margin-bottom:26px}
.options{display:grid;gap:0;border-top:1px solid var(--ink)}
.option{display:grid;grid-template-columns:22px 1fr;gap:16px;align-items:start;width:100%;text-align:left;padding:18px 14px 18px 16px;min-height:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;position:relative;transition:background .12s}
.option:hover{background:var(--panel);border-color:var(--line)}
.option-badge{font-size:0;color:transparent;min-width:0;width:12px;height:12px;border:1.5px solid var(--ink);padding:0;margin-top:8px;align-self:start;transition:background .12s,border-color .12s}
.option[aria-pressed="true"]{background:var(--panel);box-shadow:none;border-color:var(--line)}
.option[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:3px;background:var(--red)}
.option[aria-pressed="true"] .option-badge{background:var(--red);border-color:var(--red);font-size:0}
.option-content{min-width:0;flex:1}
.option-content b{display:block;font-size:16px;font-weight:700;line-height:1.5;letter-spacing:-.01em}
.option[aria-pressed="true"] .option-content b{color:var(--red)}
.option-content small{display:block;font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.6}
.option-group-label{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;font-weight:600;color:var(--red);margin:0;padding:18px 16px 6px}
.option-group-label::after{content:"";flex:1;height:1px;background:var(--line)}
.option-group-label:not(:first-child){margin-top:4px}
.quiz-controls{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:28px}
.quiz-controls .primary{min-width:150px;justify-content:space-between}
.back-btn{font-size:14px;color:var(--ink);padding:12px 0;min-height:44px}
.quiz-foot{font-size:12px;color:var(--gray);margin-top:40px;text-align:center}

/* 결과 */
.result-wrap{padding-top:0;padding-bottom:64px}
.result-intro{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:18px 0 16px}
.result-intro .eyebrow{font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink2)}
.result-intro p{font-size:13px;font-weight:500;color:var(--ink2)}
.result-hero{padding-top:48px;padding-bottom:46px;border:0;border-radius:0;overflow:hidden}
.result-hero .eyebrow{color:rgba(255,255,255,.9)}
.result-hero h1{font-size:clamp(34px,5vw,60px);font-weight:900;line-height:1.2;letter-spacing:-.035em;margin:18px 0 18px;max-width:15em;color:#fff}
.result-deco{position:absolute;right:0;top:-20px;font:500 280px/1.2 var(--mono);letter-spacing:-.08em;color:#fff;opacity:.07;pointer-events:none}
.field-labels{display:flex;gap:8px;flex-wrap:wrap}
.field-labels span{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:#fff;border:1px solid rgba(255,255,255,.7);padding:5px 10px;line-height:1.4}
.field-labels span+span::before{content:none}
.result-description{font-size:16px;line-height:1.85;max-width:36em;margin-top:20px;color:#fff}
.method-strip{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:baseline;border-top:1px solid rgba(255,255,255,.4);margin-top:28px;padding-top:20px}
.method-title{font-size:15px;font-weight:700;color:#fff}
.method-title::before{content:"연구 방식";display:block;font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;opacity:.85;margin-bottom:4px}
.method-strip p{font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.95)}
.result-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 44px}
.result-actions .primary,.result-actions .secondary{padding:12px 18px;min-height:46px;font-size:14px;text-decoration:none}
.result-actions .secondary:hover:not(:disabled){background:var(--panel);color:var(--ink)}
.share-entry{margin:22px 0 48px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);padding:18px 22px;border-left:3px solid var(--red)}
.share-entry p{font-size:14px;color:var(--ink2);margin:0}
.result-columns{display:grid;grid-template-columns:1fr 1fr;gap:48px 64px;align-items:start}
.result-section{min-width:0}
.result-section h2,.faculty-section h2,.explore h2{font-size:24px;font-weight:900;letter-spacing:-.03em;margin:0 0 6px}
.journey-path{list-style:none;padding:0;margin:0;border-top:1px solid var(--ink)}
.journey-path li{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0;border-left:0;border-bottom:1px solid var(--line);font-size:13.5px;position:static}
.journey-path li::before{display:none}
.journey-path li:last-child{padding-bottom:9px}
.journey-path span{color:var(--ink2);font-size:12.5px}
.journey-path b{font-weight:700;font-size:13.5px;line-height:1.6}
.spectrum-note,.research-common,.faculty-source,.curriculum-source p{font-size:12.5px;color:var(--gray);line-height:1.8;margin-top:14px;max-width:none}
.question-list{list-style:none;padding:0;margin:0;border-top:1px solid var(--ink);counter-reset:qn}
.question-list li{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:14px 0;border-top:0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.6;font-weight:500;letter-spacing:0;position:static}
.question-list li::before{content:"Q" counter(qn);counter-increment:qn;position:static;font-family:var(--mono);font-size:12px;color:var(--red);padding-top:4px;font-weight:600}
.ask-copy{display:inline-block;margin-top:16px;font-size:14px;color:var(--ink);padding:0}

/* 연구실 */
.faculty-section{margin-top:56px;padding-top:40px;border-top:1px solid var(--ink)}
.faculty-tabs,.goal-tabs,.curriculum-tabs{display:flex;gap:24px;flex-wrap:wrap;margin:22px 0 4px;border-bottom:1px solid var(--line)}
.faculty-tabs button,.goal-tabs button,.curriculum-tabs button{padding:10px 0 12px;min-height:0;font-size:14px;color:var(--ink2);border:0;border-bottom:2px solid transparent;border-radius:0;background:none;margin-bottom:-1px;position:static;line-height:1.5}
.faculty-tabs button:hover,.goal-tabs button:hover,.curriculum-tabs button:hover{color:var(--ink);border-color:transparent}
.faculty-tabs button[aria-pressed="true"],.goal-tabs button[aria-pressed="true"],.curriculum-tabs button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--red);background:none}
.faculty-tabs button[aria-pressed="true"]::after,.goal-tabs button[aria-pressed="true"]::after{content:none}
.faculty-count{font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1.3;margin:26px 0 16px;color:var(--ink)}
.faculty-count span{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;font-weight:600;color:var(--red);margin:6px 0 0}
.faculty-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:0;margin-top:4px}
.faculty-card{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;padding:18px 20px 16px;border:1px solid var(--line);border-left:3px solid var(--line);background:#fff}
.faculty-card.level-1{border-left-color:var(--line)}
.faculty-card.level-2,.faculty-card.first-group{border-left-color:var(--red)}
.faculty-card.level-2{background:#fff7f6}
.faculty-name{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.faculty-name h3{font-size:20px;font-weight:900;letter-spacing:-.03em;line-height:1.3;color:var(--ink)}
.faculty-name small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:6px;letter-spacing:0}
.level-2 .faculty-name h3{color:var(--ink)}
.faculty-badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:2px 7px;border:1px solid var(--line);color:var(--ink2);line-height:1.6;font-weight:500}
.level-2 .faculty-badge{background:var(--red);border-color:var(--red);color:#fff}
.level-2 .faculty-badge::before{content:none}
.faculty-card p{font-size:13px;line-height:1.6;color:var(--ink2);margin:0;letter-spacing:0}
.faculty-reasons{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 4px;font-size:10.5px;line-height:1.6}
.faculty-reasons span{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);letter-spacing:.02em;color:var(--ink2);white-space:nowrap}
.faculty-reasons span::before{content:"";width:8px;height:8px;background:var(--red);flex:none}
.faculty-reasons span+span::before{content:"";margin:0}
.level-1 .faculty-reasons span{color:var(--gray)}
.level-1 .faculty-reasons span::before{background:transparent;border:1.5px solid var(--gray)}
.faculty-links{display:flex;gap:16px;margin-top:auto;flex-wrap:wrap;padding-top:4px}
.faculty-links a{font-size:12.5px;color:var(--ink);padding:0;min-height:0}
.level-2 .faculty-links a{color:var(--ink)}
.all-faculty-directory{margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.all-faculty-directory summary{cursor:pointer;font-size:13px;font-weight:600;padding:6px 0;color:var(--ink);min-height:0;list-style:none}
.all-faculty-directory summary::-webkit-details-marker{display:none}
.all-faculty-directory summary::before{content:"+ ";font-family:var(--mono);color:var(--red)}
.all-faculty-directory[open] summary::before{content:"− "}
.all-faculty-directory .faculty-grid{margin-top:14px}
.faculty-roster{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:24px 0 10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.faculty-roster span{font-size:14px;color:var(--ink2)}
.faculty-roster .roster-highlight{color:var(--red);font-weight:700}
.recommended-grid{margin-top:4px}

/* 다음 걸음 */
.next-section{margin-top:56px;padding-top:40px;border-top:1px solid var(--ink)}
.next-kicker{font-size:13px;color:var(--ink2);margin-bottom:6px}
.next-section h2{font-size:clamp(26px,3vw,34px);font-weight:900;letter-spacing:-.03em;margin:0 0 8px}
.next-section .section-sub{max-width:40em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:30px}
.step{border-top:2px solid var(--ink);padding-top:14px}
.step-num{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--red);font-weight:600;line-height:1.6}
.step h3{font-size:16px;font-weight:700;margin:8px 0 6px;letter-spacing:-.01em}
.step p{font-size:13.5px;color:var(--ink2);line-height:1.8}
.ask-line{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:center;background:var(--panel);padding:22px 26px;margin-top:32px}
.ask-line .q{font-family:var(--sans);font-size:32px;font-weight:900;color:var(--red);line-height:1;letter-spacing:-.04em}
.ask-line p{font-size:15px;font-weight:600;line-height:1.6;letter-spacing:0}

/* 다른 호기심 (분야 표) */
.explore{margin-top:56px;padding-top:40px;border-top:1px solid var(--ink)}
.explore-grid{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--ink);margin-top:20px}
.explore-button{display:grid;grid-template-columns:36px 1fr auto;gap:16px;align-items:baseline;text-align:left;width:100%;padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
.explore-button>span:nth-child(2){display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:baseline;min-width:0}
.field-index{font-family:var(--mono);font-size:12px;color:var(--gray);font-weight:500}
.explore-button b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.explore-button small{display:block;color:var(--ink2);font-size:14px;margin:0}
.explore-arrow{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--gray);transition:transform .15s}
.explore-button:hover .explore-arrow{transform:translate(2px,-2px)}
.explore-button:hover b{color:var(--red)}

/* 결과 하단 */
.event-result{margin-top:56px;padding-top:0;border-top:0}
.event-result .event-section{margin-top:0;padding-top:44px;padding-bottom:48px;grid-template-columns:1.1fr 1fr;gap:48px}
.event-result .event-info strong{font-size:clamp(30px,4vw,48px)}
.result-details{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.result-details summary{cursor:pointer;font-size:13px;font-weight:600;padding:6px 0;color:var(--ink)}
.result-details summary{list-style:none}
.result-details summary::-webkit-details-marker{display:none}
.result-details summary::before{content:"+ ";font-family:var(--mono);color:var(--red)}
.result-details[open] summary::before{content:"− "}
.result-details p{margin-top:14px;line-height:1.9;max-width:none}
.answer-review{list-style:none;padding:0;margin:16px 0 0}
.answer-review li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px}
.answer-review b{color:var(--ink);font-size:13px;font-weight:700;line-height:1.6}
.result-wrap>.event-actions{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px}
.result-wrap>.event-actions button,.result-wrap>.event-actions a{font-size:14px;color:var(--ink);min-height:0}

/* 전공 수업 미리보기 */
.curriculum-panel{border-top:3px solid var(--red);background:var(--panel);padding:26px 28px 28px;margin:0 0 48px}
.curriculum-disclosure .curriculum-panel{background:none;border-top:0;padding:0;margin:24px 0 20px}
.curriculum-heading{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end;margin-bottom:24px}
.curriculum-heading .section-number{margin-bottom:14px}
.curriculum-heading h2{font-size:clamp(24px,3vw,32px);font-weight:900;line-height:1.25;letter-spacing:-.02em}
.curriculum-heading>p{font-size:13.5px;color:var(--ink2);line-height:1.7}
.curriculum-roadmap{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border:0}
.curriculum-roadmap>li,.curriculum-roadmap>li+li{padding:14px 18px 16px;border:1px solid var(--line);border-top:2px solid var(--ink);background:#fff;min-width:0}
.curriculum-year{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.04em;font-weight:600;color:var(--red);margin-bottom:8px}
.curriculum-roadmap h3{font-size:16px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.curriculum-roadmap p{font-size:13.5px;line-height:1.8;color:var(--ink2)}
.curriculum-roadmap .curriculum-course-line{margin-top:12px;border-top:1px solid var(--line2);padding-top:8px}

const MATCHING_POLICY={topic:80,context:20,firstGroup:6,primary:1,connected:.5};
function topicConnection(id,route){
 const pair=TOPIC_LINKS[route.scene+'/'+route.detail];
 return !pair?0:pair[0].includes(id)?1:pair[1].includes(id)?.5:0;
}
function facultyConnections(result,area='mine'){
 const key=result.route.scene+'/'+result.route.detail;
 const ids=[...new Set(result.topic.areas)];
 const tags=result.topic.tags;
 const rows=FACULTY.map(f=>{
  const aw=id=>AREA_WEIGHTS[f.id][AREA_IDS.indexOf(id)]||0;
  if(area==='all')return {...f,level:0,reasons:[],score:0,rank:null,inFirstGroup:false};
  if(area!=='mine')return {...f,level:aw(area)===1?2:aw(area)>.0?1:0,reasons:aw(area)>0?['이 입구에서 함께 살펴볼 연구']:[],score:aw(area)*100,rank:null,inFirstGroup:false};
  const topicWeight=topicConnection(f.id,result.route);
  // Scene and detail form ONE interest budget. They are not separate votes.
  // Context = 1/2 selected entry + 1/2 normalized cross-field context of the topic.
  const contextWeight=.5*aw(result.route.scene)+.5*ids.reduce((n,id)=>n+aw(id),0)/ids.length;
  const score=Math.round((MATCHING_POLICY.topic*topicWeight+MATCHING_POLICY.context*contextWeight)*1e6)/1e6;
  const reasons=f.topics.filter(t=>tags.includes(t));
  return {...f,level:topicWeight===1?2:topicWeight===.5?1:0,topicWeight,contextWeight,score,
   reasons:topicWeight>0?(reasons.length?reasons:[topicWeight===1?'선택 주제의 주요 연구 연결':'소재·원리에서 이어지는 연결']):[],rank:null,inFirstGroup:false};
 });
 if(area==='mine'){
  rows.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ko'));
  for(const f of rows){
   f.rank=1+rows.filter(other=>other.score>f.score).length;
   f.inFirstGroup=f.topicWeight>0&&f.rank<=MATCHING_POLICY.firstGroup;
  }
 }
 return rows;
}

return {FACULTY_SOURCE,FACULTY_CHECKED,FACULTY,TAG_NAMES,AREA_IDS,AREA_WEIGHTS,TOPIC_LINKS,MATCHING_POLICY,topicConnection,facultyConnections};

function renderFaculty(area){

 const card=f=>`<article class="faculty-card level-${f.level}${area==='mine'&&f.inFirstGroup?' first-group':''}"><div class="faculty-name"><h3>${f.name}<small>교수님</small></h3>${f.level?`<span class="faculty-badge">${f.level===2?(area==='mine'?'선택 주제와 연결':'관심 분야와 연결'):'이어지는 연구'}</span>`:''}</div><p>${f.summary}</p>${f.level?`<div class="faculty-reasons">${f.reasons.slice(0,3).map(t=>`<span>${esc(TAG_NAMES[t]||t)}</span>`).join('')}</div>`:''}<div class="faculty-links"><a href="${esc(f.url)}" target="_blank" rel="noopener" aria-label="${f.name} 교수님 연구실 홈페이지">연구실 ↗</a>${f.source!==f.url?`<a href="${esc(f.source)}" target="_blank" rel="noopener" aria-label="${f.name} 교수님 연구분야 소개 근거">연구분야 소개 ↗</a>`:''}</div></article>`;
 let content;

  const all=FACULTY.map(f=>rows.find(x=>x.id===f.id));

 }else content=`<p class="faculty-count">${caption}<span>강조 여부와 관계없이 전체 ${FACULTY.length}명 표시 · 가나다순</span></p><div class="faculty-grid">${rows.map(card).join('')}</div>`;

}

function toast(text){const el=document.querySelector('.toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200);}
function showDialog(content){document.querySelector('#dialog-content').innerHTML=content;if(!dialog.open)dialog.showModal();}
function about(){showDialog('<div class="eyebrow">이 테스트에 대하여</div><h2>호기심의 출발점을 찾아요</h2><p>GIST 신소재공학과 오픈데이를 위한 연구 관심 탐색 콘텐츠입니다. 전공 미선언자와 신소재·타학과 재학생 모두 참여할 수 있어요.</p><p>결과는 전공 적합성이나 능력, 진학 가능성을 평가하지 않습니다. 관심사를 따라 후속 질문이 바뀌는 7단계 탐색이에요. 응용 분야와 인공지능(AI) 소재설계·뉴로모픽 소자, 분자·고분자·소재 원리도 다루고, 관심과 연결되는 연구실을 먼저 안내하고, 전체 교수진 명단도 함께 보여드려요. 연구실 연결은 공개 연구소개를 바탕으로 한 검토 전 초안입니다.</p><p>학년·전공·답변은 현재 참여하는 동안만 유지됩니다. 별도 이름·학번·연락처를 받지 않으며 응답을 서버로 전송하지 않습니다. 공유 링크는 첫 화면으로 연결되며, 새로 열거나 새로고침하면 새로 시작합니다.</p><p>행사 정보는 2026년 10월 학과 안내 기준이며, 세부 사항은 최신 학과 공지를 확인해주세요.</p><p><button class="text-button" data-action="clear">처음부터 새로 시작하기</button></p>');}
function showEvent(){showDialog(eventBlock(true));}
function explore(id){const f=fieldById(id);if(!f)return;showDialog(`<div class="eyebrow" style="color:${f.color}">MATERIAL ${f.code}</div><h2>${f.name}</h2><p>${f.description}</p><div class="programs">${f.examples.map(e=>`<span>${e}</span>`).join('')}</div><p>${f.connections}</p><ul>${f.questions.map(q=>`<li>${q}</li>`).join('')}</ul><a class="primary" href="${EVENT.facultyUrl}" target="_blank" rel="noopener">전체 교수·연구실 살펴보기 ↗</a>`);}
function wrapCanvas(ctx,text,width){const lines=[];let line='';for(const ch of text){if(ctx.measureText(line+ch).width>width&&line){lines.push(line);line=ch;}else line+=ch;}if(line)lines.push(line);return lines;}
function downloadFile(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function calendar(){
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GIST MSE//Research Taste//KO','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:gist-mse-open-day-20261106@research-taste','DTSTAMP:'+stamp,'DTSTART:20261106T070000Z','DTEND:20261106T110000Z','SUMMARY:'+EVENT.title,'LOCATION:'+EVENT.place,'DESCRIPTION:학과·전공 소개 / 교수·선배 Q&A / 연구실 포스터 소개\\n저녁 간담회는 별도 식당에서 진행됩니다. 세부사항은 학과 공지를 확인해주세요.','END:VEVENT','END:VCALENDAR'].join('\r\n')+'\r\n';
 downloadFile(new Blob([ics],{type:'text/calendar;charset=utf-8'}),'GIST_신소재_오픈데이_20261106.ics');toast('캘린더 파일을 저장했어요. 열어서 일정을 추가해주세요.');
}
async function copy(text,success){try{await navigator.clipboard.writeText(text);toast(success);}catch{showDialog(`<h2>복사할 내용</h2><p style="word-break:break-all;user-select:all">${esc(text)}</p><p>내용을 길게 누르거나 드래그해 복사해주세요.</p>`);}}
function shareLink(){const base=location.protocol==='file:'?'https://gist-mse-research-taste.spell-5239.chatgpt.site/':location.origin+location.pathname;copy(base,'처음부터 시작하는 테스트 링크를 복사했어요.');}
async function imageCard(){
 if(!currentResult)return;const r=currentResult;const f=r.area;
 if(document.fonts?.ready)await document.fonts.ready;
 const c=document.createElement('canvas');c.width=1080;c.height=1350;const ctx=c.getContext('2d');
 ctx.fillStyle='#f4f7fa';ctx.fillRect(0,0,1080,1350);
 ctx.fillStyle='#102036';ctx.font='800 47px sans-serif';ctx.fillText('GIST',73,105);
 ctx.font='21px sans-serif';ctx.fillText('신소재공학과',242,87);ctx.fillStyle='#40546b';ctx.font='16px monospace';ctx.fillText('RESEARCH TASTE / 2026',242,115);
 ctx.fillStyle='#102036';ctx.fillRect(74,164,932,2);
 ctx.fillStyle='#d2231c';ctx.font='400 72px monospace';ctx.fillText(f.code,74,293);
 ctx.fillStyle='#40546b';ctx.font='23px sans-serif';ctx.fillText('내가 고른 연구 이야기',205,280);
 ctx.fillStyle='#102036';ctx.font='700 62px sans-serif';let y=402;
 for(const line of wrapCanvas(ctx,resultTitle(r),925)){ctx.fillText(line,73,y);y+=89;}
 ctx.fillStyle='#40546b';ctx.font='25px sans-serif';y=Math.max(y+42,628);
 for(const line of wrapCanvas(ctx,r.top.map(id=>fieldById(id).name).join(' / '),925)){ctx.fillText(line,75,y);y+=40;}
 ctx.fillStyle='#d6d8dc';ctx.fillRect(75,755,930,1);
 ctx.fillStyle='#40546b';ctx.font='20px sans-serif';ctx.fillText('내가 고른 연구 방식',75,807);
 ctx.fillStyle='#102036';ctx.font='600 32px sans-serif';ctx.fillText(r.ways.map(id=>methodById(id).name).join(' + '),75,864);
 ctx.font='25px sans-serif';ctx.fillText('지금의 호기심에서, 다음의 경험으로.',75,961);
 ctx.fillStyle='#d2231c';ctx.fillRect(0,1035,1080,315);
 ctx.fillStyle='#ffffff';ctx.font='700 34px sans-serif';ctx.fillText(EVENT.title,75,1109);
 ctx.font='26px sans-serif';ctx.fillText(EVENT.date+'  '+EVENT.time,75,1172);ctx.fillText(EVENT.place,75,1217);
 ctx.fillStyle='#ffffff';ctx.font='19px sans-serif';ctx.fillText('전공부터 연구실까지, 직접 만나 물어보세요.',75,1281);
 const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob){toast('카드를 저장하지 못했어요. 화면을 캡처해주세요.');return;}
 downloadFile(blob,'GIST_나의_연구취향.png');toast('결과 카드를 이미지로 저장했어요.');
}
document.addEventListener('click',async e=>{
 const choice=e.target.closest('[data-choice]');
 if(choice){selected=choice.dataset.choice;for(const b of document.querySelectorAll('[data-choice]')){const is=b===choice;b.setAttribute('aria-pressed',String(is));b.querySelector('.option-badge').textContent=is?'✓':b.dataset.letter;}document.querySelector('[data-action="next"]').disabled=false;return;}
 const facultyTab=e.target.closest('[data-faculty-area]');if(facultyTab){renderFaculty(facultyTab.dataset.facultyArea);document.querySelector(`[data-faculty-area="${facultyTab.dataset.facultyArea}"]`).focus({preventScroll:true});return;}
 const curriculumTab=e.target.closest('[data-curriculum-area]');if(curriculumTab){renderCurriculum(curriculumTab.dataset.curriculumArea);document.querySelector(`[data-curriculum-area="${curriculumTab.dataset.curriculumArea}"]`).focus({preventScroll:true});return;}
 const field=e.target.closest('[data-field]');if(field){explore(field.dataset.field);return;}
 const goal=e.target.closest('[data-goal]');if(goal&&currentResult&&!shared){answers.goal=goal.dataset.goal;currentResult.profile.goal=answers.goal;renderNext(currentResult.profile);document.querySelector(`[data-goal="${answers.goal}"]`).focus({preventScroll:true});return;}
 if(e.target.closest('.header-event')){e.preventDefault();showEvent();return;}
 if(e.target.closest('.close-dialog')){dialog.close();return;}
 if(e.target.closest('#about')){about();return;}
 const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
 if(action==='start'){answers={};selected=null;goQuiz(0);}
 else if(action==='next'){
   const q=getQuestion(questionIndex,answers);if(!selected||!q.options.some(o=>o.id===selected))return;answers=setAnswer(answers,q.id,selected);
   if(questionIndex===QUESTIONS.length-1){location.hash='result';renderResult(assess(answers));}else goQuiz(questionIndex+1);window.scrollTo(0,0);
 }else if(action==='back'){if(questionIndex===0)location.hash='';else goQuiz(questionIndex-1);window.scrollTo(0,0);}
 else if(action==='restart'||action==='clear'){answers={};if(dialog.open)dialog.close();if(action==='clear'){resetToStart();toast('새로 시작할 준비가 됐어요.');}else goQuiz(0);window.scrollTo(0,0);}
 else if(action==='revise')goQuiz(2);
 else if(action==='event')showEvent();
 else if(action==='calendar')calendar();
 else if(action==='share')shareLink();
 else if(action==='download')await imageCard();
 else if(action==='copy-questions')copy(resultQuestions(currentResult).join('\n'),'질문을 복사했어요. 오픈데이에서 물어보세요.');
});
dialog.addEventListener('click',e=>{if(e.target===dialog){const b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close();}});
function route(){
 const hash=location.hash.slice(1);const q=hash.match(/^q\/(\d+)$/);
 if(q){let n=Math.min(QUESTIONS.length-1,Math.max(0,Number(q[1])-1));const missing=QUESTIONS.findIndex(x=>!answers[x.id]);if(missing>=0)n=Math.min(n,missing);renderQuestion(n);return;}
 if(hash==='result'){try{renderResult(assess(answers));return;}catch{resetToStart();return;}}
 resetToStart();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0);});
window.addEventListener('pageshow',event=>{if(event.persisted)resetToStart();});
resetToStart();

return {};
})();
})();</script>
</body></html>
